[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftxt"
dynamic = ["version"]
description = "Strict codebase-to-text bundler with in-place updates and ACID guarantees."
readme = "README.md"
authors = [{ name = "germanter" }]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
ftxt = "ftxt.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ftxt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]